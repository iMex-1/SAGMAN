version: '3.9'

# Development infrastructure — only database services.
# Run apps locally with: pnpm dev:api  and  pnpm dev:web

services:
  postgres:
    image: postgres:16-alpine
    container_name: sagman_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: sagman_dev
      POSTGRES_USER: sagman
      POSTGRES_PASSWORD: sagman_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagman -d sagman_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sagman_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_dev_data:
  redis_dev_data:
